# Channel -> project routing for Hermes
#
# This block goes in YOUR HERMES config.yaml (not in this repo), at the top
# level. `install.py` prints it filled in with your channels.
#
# Hermes home config.yaml is at:
#   Windows: %LOCALAPPDATA%\hermes\config.yaml
#   macOS/Linux: ~/.hermes/config.yaml

discord:
  channels:
    # `folder:` (recommended) is an absolute path, used as-is.
    - id: '1234567890123456789'
      folder: C:/Users/YOU

    - id: '9876543210987654321'
      folder: D:/code/myproject

    # `project:` is a project NAME looked up in Hermes's projects.db. If that
    # database is empty the lookup fails and the channel is not routed, so
    # prefer `folder:` unless your projects are registered there.
    # - id: '1111111111111111111'
    #   project: myproject

# Get a channel ID: Discord Settings -> Advanced -> Developer Mode, then
# right-click the channel -> Copy Channel ID.
#
# The bot token is NOT set here -- it comes from DISCORD_BOT_TOKEN in your
# Hermes .env, the same one the Discord platform already uses.
