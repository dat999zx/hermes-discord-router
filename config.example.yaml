# Hermes Discord Router Configuration
# Copy this to config.yaml and fill in your values

discord:
  # Your Discord bot token (from Discord Developer Portal)
  token: "YOUR_BOT_TOKEN_HERE"

# Channel to project mappings
# Get channel IDs: Discord Developer Mode → Right-click channel → Copy ID
channels:
  - id: "1234567890123456789"
    project: "my-project"
    folder: "D:/projects/my-project"  # Optional: defaults to ~/projects/<project>
    
  - id: "9876543210987654321"
    project: "another-project"
    # folder not specified = uses default path

# Hermes configuration
hermes:
  # Path to Hermes CLI executable
  # Leave as "hermes" if globally installed
  # For dev builds: "C:/Users/Admin/AppData/Local/hermes/knowl-dev.cmd"
  cli: "hermes"
  
  # Default projects root (used when folder not specified)
  # Channels without explicit folder use: {projects_root}/{project_name}
  projects_root: "~/projects"
  
  # Timeout for Hermes responses (seconds)
  timeout: 300

# Bot behavior
behavior:
  # React with 📚 when routing to Knowl
  react_on_route: true
  
  # Create threads for responses (keeps channels clean)
  use_threads: false
  
  # Require @mention to respond (vs respond to all messages)
  require_mention: false
  
  # Ignore messages from other bots
  ignore_bots: true
