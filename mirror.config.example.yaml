# Hermes Desktop -> Discord mirror config
#
# Mirrors Hermes DESKTOP prompts/replies into a per-session Discord thread in
# the mapped channel. Pairs with the gateway's Discord<->Hermes routing so
# Discord becomes a full second view of your projects.
#
# bot_token: leave as ${DISCORD_BOT_TOKEN} to read the env var, or omit to
# auto-read hermes's own .env (LOCALAPPDATA/hermes/.env). A literal token works
# too but keep this file out of git (see .gitignore).
bot_token: ${DISCORD_BOT_TOKEN}

# hermes_home: where state.db / projects.db / .env live. Omit to use
# %LOCALAPPDATA%/hermes.
hermes_home: C:/Users/YOU/AppData/Local/hermes

poll_seconds: 2.0

# Map each Discord channel to a project. Use `project:` (looked up in
# projects.db, same as the desktop sidebar) OR an explicit `cwd:`.
channels:
  - id: '1545381328462024806'   # #home
    project: Home
  - id: '1545385614797709322'   # #knowl
    project: knowl
